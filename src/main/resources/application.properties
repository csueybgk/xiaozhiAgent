server.port=8080

# DeepSeek API configuration
langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY}
# DeepSeek-V3
langchain4j.open-ai.chat-model.model-name=deepseek-chat
# DeepSeek streaming chat model (langchain4j 要求单独配置, 否则 openAiStreamingChatModel 不会创建)
langchain4j.open-ai.streaming-chat-model.base-url=https://api.deepseek.com
langchain4j.open-ai.streaming-chat-model.api-key=${DEEPSEEK_API_KEY}
langchain4j.open-ai.streaming-chat-model.model-name=deepseek-chat
# DeepSeek-R1 (reasoning model)
# langchain4j.open-ai.chat-model.model-name=deepseek-reasoner

# Request/Response logging
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

# MongoDB????
spring.data.mongodb.uri=mongodb://localhost:27017/chat_memory_db

# Debug logging
logging.level.root=info


# ???????
# allowPublicKeyRetrieval=true：MySQL 8 的 root 用 caching_sha2_password，首次认证要么走 TLS、
# 要么用服务端 RSA 公钥加密密码。这里 useSSL=false 关掉了 TLS，若不显式允许取公钥，
# 驱动会抛 "Public Key Retrieval is not allowed"。
# 注意：该参数在非受信网络上存在中间人替换公钥的风险，生产环境应改用 sslMode=REQUIRED。
spring.datasource.url=jdbc:mysql://localhost:3306/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver




# ?? SQL ????
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl


# ===== RAG 检索 =====
# ReRank 分数阈值：低于该分数的检索结果一律丢弃；若全部不达标则视为「知识库无相关资料」，
# 由 GuardedContentInjector 注入「如实说不知道」的指令，避免模型凭自身记忆编造。
# 取值依据见 HybridContentRetriever.DEFAULT_RERANK_THRESHOLD 注释（实测域内下界 0.85 / 域外上界 0.014）。
xiaozhi.rag.rerank-threshold=0.1
